{% extends "base.html" %}

{% block content %}

<h1>Edit Product</h1>

<form method="POST">

<input
    type="text"
    name="name"
    value="{{ product.name }}"
    required
>

<br><br>

<input
    type="text"
    name="category"
    value="{{ product.category }}"
    required
>

<br><br>

<input
    type="number"
    name="price"
    value="{{ product.price }}"
    required
>

<br><br>

<input
    type="number"
    name="quantity"
    value="{{ product.quantity }}"
    required
>

<br><br>

<input
    type="number"
    name="reorder_level"
    value="{{ product.reorder_level }}"
    required
>

<br><br>

<input
    type="text"
    name="supplier"
    value="{{ product.supplier }}"
    required
>

<br><br>

<button type="submit">
    Update Product
</button>

</form>

{% endblock %}
