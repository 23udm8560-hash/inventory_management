{% extends "base.html" %}

{% block content %}

<h1>Add Product</h1>

<form method="POST">

<input
    type="text"
    name="name"
    placeholder="Product name"
    required
>

<br><br>

<input
    type="text"
    name="category"
    placeholder="Category"
    required
>

<br><br>

<input
    type="number"
    name="price"
    placeholder="Price"
    required
>

<br><br>

<input
    type="number"
    name="quantity"
    placeholder="Quantity"
    required
>

<br><br>

<input
    type="number"
    name="reorder_level"
    placeholder="Reorder Level"
    required
>

<br><br>

<input
    type="text"
    name="supplier"
    placeholder="Supplier"
    required
>

<br><br>

<button type="submit">
    Add Product
</button>

</form>

{% endblock %}
