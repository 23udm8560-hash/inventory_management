{% extends "base.html" %}

{% block content %}

<h1>Add Customer</h1>

<form method="POST">

<input
    type="text"
    name="name"
    placeholder="Customer name"
    required
>

<br><br>

<input
    type="email"
    name="email"
    placeholder="Email"
    required
>

<br><br>

<input
    type="text"
    name="phone"
    placeholder="Phone"
    required
>

<br><br>

<input
    type="text"
    name="city"
    placeholder="City"
    required
>

<br><br>

<button type="submit">
    Add Customer
</button>

</form>

{% endblock %}
